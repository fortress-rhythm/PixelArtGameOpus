<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hourglass Character Editor</title>
<style>
  /* One dark look on purpose: the game's own ink and lamplight, so colours are judged against the game's darkness. */
  :root { color-scheme: dark; --bg: #0f0d14; --panel: #17141f; --line: #2c2838; --fg: #e9e2d0; --muted: #a59eae; --accent: #f2b86e; --stage: #07060a;
          --mono: ui-monospace, "Cascadia Mono", Consolas, "JetBrains Mono", monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
  .app { display: grid; grid-template-columns: minmax(280px, 340px) 1fr; height: 100%; }
  .side { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 40px; background: var(--panel); }
  .main { overflow-y: auto; padding: 14px 18px 40px; display: grid; gap: 14px; align-content: start;
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
  h1 { font: 600 15px/1.2 var(--mono); letter-spacing: .04em; margin: 2px 0 10px; color: var(--accent); }
  h2 { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .row { display: grid; grid-template-columns: 92px 1fr 34px; gap: 8px; align-items: center; margin: 5px 0; }
  .row label { color: var(--muted); font-size: 12.5px; }
  .row output { font: 12px var(--mono); color: var(--fg); text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=text], textarea, button { font: 12.5px var(--mono); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
  select { width: 100%; }
  button { cursor: pointer; padding: 5px 9px; }
  button:hover, select:hover { border-color: var(--accent); }
  button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; }
  .checks label { display: flex; gap: 5px; align-items: center; color: var(--fg); }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 10px; }
  .slot { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; background: none; border: 0; padding: 2px; text-align: left; }
  .slot b { font: 600 12px var(--mono); color: var(--fg); width: 12px; }
  .sw { width: 18px; height: 18px; border-radius: 3px; border: 1px solid var(--line); flex: none; }
  .palette { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin: 8px 0; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; }
  .palette button { aspect-ratio: 1; padding: 0; border-radius: 3px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .card h2 { margin-top: 0; }
  .stage { background: var(--stage); border-radius: 5px; padding: 10px; overflow-x: auto; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; white-space: pre; }
  .wide { grid-column: 1 / -1; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #141119; padding: 6px 12px; border-radius: 4px; font: 600 13px var(--mono); }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; height: auto; } .side { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Character settings"></aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
