<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Bridge</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas#screen { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
                  image-rendering: crisp-edges; image-rendering: pixelated; background: #000; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); color: #a49cb8; font: 13px system-ui, sans-serif;
          letter-spacing: .04em; opacity: .85; transition: opacity 1.2s; pointer-events: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hint">click or press a key for sound</div>
<script>
/*
 * NIGHT BRIDGE - a cinematic scene. Vanilla JS + Canvas 2D, no external assets. Brief: docs/briefs/night-bridge.md.
 *
 * A woman in a red cloak catches two children on a glass bridge at night, takes them to an inn, walks back up,
 * takes off the cloak and lets herself into the lighthouse; its lamp lights. The story plays once (STORY_S), then the
 * scene settles into a seamless ambient loop (LOOP_S). Every frame is a function of the time alone: nothing is
 * simulated, so ?t= jumps anywhere and two runs agree.
 *
 * Framebuffer: 320x180 palette indices plus a layer id per pixel (for selective light), as in the garden.
 * Layers, back to front, each moving at its own fraction of the camera (LAY.pSky ...): sky and moon, mountain,
 * hills, then the world at 1: water, lighthouse, town, the glass bridge (a palette remap over what is behind it),
 * people, the near railing, reflections, boats, lights. Positions are world pixels as the opening shot sees them,
 * heights measured up from the bottom of the opening shot (the layout tool's convention).
 *
 * Optional URL parameters: ?t=SECONDS, &freeze=1, ?stats=1 (src_cine/99_main.js).
 */
// @ts-check
// =================================================================== CINEMATIC CORE: BASE
// Shared by the cinematic scenes (src_garden, src_bridge). Loads first: the timing constants and the pure helpers.
// A scene's own config comes next (W, H, IY0, IY1, IH, LOOP_S, CINE_S, PAL_HEX, its palette remaps), then
// 01_frame.js, then the scene, then 99_main.js. Everything shares one global scope.
'use strict';

const FPS = 60, DT = 1 / FPS;
const TAU = Math.PI * 2;
const T = 255;                                      // transparent index in sprite/layer buffers

// ------------------------------------------------------------------ palette remaps
function makeMap(pairs) {
  const m = new Uint8Array(256);
  for (let i = 0; i < 256; i++) m[i] = i;
  for (let i = 0; i < pairs.length; i += 2) m[pairs[i]] = pairs[i + 1];
  return m;
}

// ------------------------------------------------------------------ math / noise helpers
const BAYER = new Float32Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16));
function bay(x, y) { return BAYER[((y & 3) << 2) | (x & 3)]; }
// integer hash (0..65535, always a small int so calls never box a double) + tiny inlinable scaler
function hashi(a, b) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ 0x5bd1e995;
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
  h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
  return (h ^ (h >>> 15)) >>> 16;
}
function hash(a, b) { return hashi(a, b) * 1.52587890625e-5; }   // [0,1)
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function smoother(t) { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); }
function frac(v) { return v - Math.floor(v); }
// loop-locked oscillator: k whole cycles per loop
function osc(k, t, ph) { return Math.sin(TAU * (k * t / LOOP_S + ph)); }
// smooth 1D value noise, periodic with period p (integer)
function pnoise(x, p, seed) {
  const i = Math.floor(x), f = x - i, a = hash(((i % p) + p) % p, seed), b = hash((((i + 1) % p) + p) % p, seed);
  return lerp(a, b, f * f * (3 - 2 * f));
}

// A palette remap from a colour rule: each colour goes to the palette colour nearest fn([r, g, b]). fam[i] names
// colour i's family ('' for none); a colour in a family only maps within it, and nothing else maps into a family,
// so a character's colours never turn up on the scenery.
function paletteMap(hex, fam, fn) {
  const rgb = hex.map(h => { const v = parseInt(h, 16); return [v >> 16, (v >> 8) & 255, v & 255]; });
  const m = new Uint8Array(256);
  for (let i = 0; i < 256; i++) m[i] = i;
  for (let i = 0; i < rgb.length; i++) {
    const want = fn(rgb[i].slice());
    let best = i, bd = Infinity;
    for (let j = 0; j < rgb.length; j++) {
      if (fam[j] !== fam[i]) continue;
      const c = rgb[j], rm = (c[0] + want[0]) / 2, dr = c[0] - want[0], dg = c[1] - want[1], db = c[2] - want[2];
      const d = (2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db;   // "redmean" distance
      if (d < bd) { bd = d; best = j; }
    }
    m[i] = best;
  }
  return m;
}

// @ts-check
// =================================================================== NIGHT BRIDGE: CONFIG
// ------------------------------------------------------------------ screen and time
const W = 320, H = 180, BAR = 0, IH = H, IY0 = 0, IY1 = H;      // no letterbox: the whole frame is picture
const STORY_S = 92, LOOP_S = 24;                                 // the story once, then an ambient loop
const CINE_S = STORY_S + LOOP_S;
const STORY_F = STORY_S * FPS, LOOP_F = LOOP_S * FPS, CINE_F = CINE_S * FPS;

// ------------------------------------------------------------------ layout
// The layout tool's values (https://claude.ai/artifact/HWS7V8ao8GacL9atNQLFxC), same names. Paste a new "For the
// brief" layout over these. Heights in % are of the screen height, up from the bottom of the opening shot.
const LAY = {
  worldW: 620, headroom: 70,
  river: 16, leftX: -30, leftY: 22, peakX: 150, peakY: 40, rightX: 420, rightY: 24,
  thickTop: 6, thickEnd: 30, sharp: 3, approach: 44, openings: 2, panels: 12,
  lampEvery: 18, glowN: 6, spots: 3, trees: 7, larchEvery: 3,
  lhDx: 10, stairRise: 10, lhH: 96,
  mountX: 300, mountH: 64, mountW: 380, hills: 28, slope: 4, cliffs: 3,
  moonX: 200, moonY: 78, moonR: 10,
  shopsX: 470, shops: 4, inn: 2, camelliaX: 500,
  shotOpen: 0, shotDoor: 300, shotTower: 20, towerUp: 40,
  pSky: 0, pMount: 0.1, pHills: 0.3, pFore: 1
};
// Sizes the tool drew without people to measure against, set here to fit a 30 px woman (see the brief).
const SIZE = {
  treeH: 38,        // conifers in pots; larches are 0.8 of this (tool: 18)
  lhW: 18,          // lighthouse width, so she fits through its door (tool: 10)
  rail: 12,         // railing height above the deck
  doorW: 10, doorH: 33,   // the lighthouse door
  innDoorW: 16, innDoorH: 34
};
const pct = (v) => v / 100 * H;
const RIVER_Y = pct(LAY.river);          // far water line (world y)
const WATER_Y = RIVER_Y - 3;             // where piers, banks and the lighthouse meet the water: reflections mirror here
const STREET_Y = Math.round(pct(LAY.rightY));   // the town's street, level with the bridge's right end
const LH = H + LAY.headroom;             // world height covered by the layers

// ------------------------------------------------------------------ palette
// families keep colours apart: her hair, cloak and tunic, and skin, only ever remap among themselves
const PAL = [
  ['BLK', '07060a'], ['INK', '120f1c'],
  ['SK0', '0b0916'], ['SK1', '100d1d'], ['SK2', '151126'], ['SK3', '1a1530'], ['SK4', '201a3a'], ['SK5', '261f43'], ['SK6', '2c234b'],
  ['STAR', 'cfc8e6'], ['MOON', 'e4def4'], ['MOONS', 'b4aad6'], ['HALO', '3e3466'],
  ['MT0', '1d1733'], ['MT1', '272043'], ['MT2', '3a3160'], ['SNOW0', '6f6898'], ['SNOW1', 'a9a3c8'],
  ['HL0', '111a1d'], ['HL1', '172426'], ['HL2', '1f312f'], ['HL3', '2b4238'],
  ['CL0', '35203d'], ['CL1', '4f2c4b'], ['CL2', '6b3b5a'],
  ['W0', '05070c'], ['W1', '0b111d'], ['W2', '121b2e'], ['W3', '1c2a45'], ['W4', '34466c'],
  ['G0', '4c5276'], ['G1', '7a82a8'], ['G2', 'b3bbd8'], ['G3', 'e8ebf8'],
  ['AM0', '5a3820'], ['AM1', 'a8682e'], ['AM2', 'f0b464'], ['AM3', 'ffe4ae'],
  ['PH0', '1f4a48'], ['PH1', '3f9a88'], ['PH2', '8fe3c8'], ['PH3', 'd8fff0'],
  ['ST0', '2e2a40'], ['ST1', '4e4968'], ['ST2', '7f7a9c'], ['ST3', 'b9b4cc'],
  ['WL0', '1a1524'], ['WL1', '251e33'], ['WL2', '332a45'], ['WL3', '45395a'],
  ['WD0', '2a1a20'], ['WD1', '43292c'],
  ['LF0', '16231c'], ['LF1', '22362a'], ['BL0', '8c3f58'], ['BL1', 'd77a8e'],
  ['LA0', '7a6428'], ['LA1', 'cfae48'],
  ['SKN0', 'e8c0a0', 'skin'], ['SKN1', 'b88466', 'skin'], ['SKN2', '7a4e42', 'skin'],
  ['HR0', '5a2219', 'hair'], ['HR1', '93402a', 'hair'], ['HR2', 'c8714a', 'hair'],
  ['CK0', '35101a', 'cloak'], ['CK1', '621a26', 'cloak'], ['CK2', '8f2c36', 'cloak'],
  ['TU0', '1f4f72', 'tunic'], ['TU1', '3f86b8', 'tunic'], ['TU2', '82bde0', 'tunic'],
  ['KA0', '4a3d32'], ['KA1', '6e5c48'], ['KB0', '343c50'], ['KB1', '505c76'], ['KH', '2a1e1a'],
  ['PM0', '9e9584'], ['PM1', '6a6458'], ['PW0', '3a4a3e'], ['PS0', '47334a'], ['PS1', '5e5a6a'], ['GRY', '8e8a98'],
  ['BT0', '1d1828'], ['BT1', '30293f'], ['BT2', '4a4060'], ['FUN', '5a2a2e'], ['SMK', '2c2740']
];
const PAL_HEX = PAL.map(p => p[1]);
const PAL_FAM = PAL.map(p => p[2] || '');
const NPAL = PAL.length;
/** @type {Record<string, number>} */
const C = {};
PAL.forEach((p, i) => { C[p[0]] = i; });

// ------------------------------------------------------------------ light (palette remaps from colour rules)
const rgbOf = (n) => { const v = parseInt(PAL_HEX[C[n]], 16); return [v >> 16, (v >> 8) & 255, v & 255]; };
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const scl = (a, k, add) => [a[0] * k + add[0], a[1] * k + add[1], a[2] * k + add[2]];
const LIT = paletteMap(PAL_HEX, PAL_FAM, c => scl(c, 1.3, [34, 18, 0]));              // warm lamp light
const SHD = paletteMap(PAL_HEX, PAL_FAM, c => scl(c, 0.68, [0, 0, 4]));               // cool shadow
const GLASS = paletteMap(PAL_HEX, PAL_FAM, c => scl(mix(c, rgbOf('G1'), 0.2), 1.12, [4, 4, 10]));   // seen through the bridge
const GLASS2 = paletteMap(PAL_HEX, PAL_FAM, c => scl(mix(c, rgbOf('G1'), 0.1), 1.06, [2, 2, 6]));   // through a railing panel
const REFL = paletteMap(PAL_HEX, PAL_FAM, c => mix(scl(c, 0.62, [0, 0, 0]), rgbOf('W2'), 0.35));     // mirrored in the river
const BEAM = paletteMap(PAL_HEX, PAL_FAM, c => scl(mix(c, rgbOf('G2'), 0.16), 1.1, [6, 6, 10]));   // lamp beams, spotlights
const PHOS = paletteMap(PAL_HEX, PAL_FAM, c => scl(c, 1.1, [8, 34, 26]));             // the bridge's inner glow, fireflies
const RIM = paletteMap(PAL_HEX, PAL_FAM, c => mix(c, rgbOf('MOON'), 0.3));            // moonlight on an edge

// ------------------------------------------------------------------ layer ids (light masks)
const L = { NONE: 0, SKY: 1, MOUNT: 2, HILL: 3, WATER: 4, BANK: 5, TOWER: 6, BRIDGE: 7, TREE: 8, TOWN: 9, WIN: 10,
            PEOPLE: 11, BOAT: 12, FLY: 13, LAMP: 14 };
const bit = (...ids) => ids.reduce((m, i) => m | (1 << i), 0);
const M_ALL = 0x7fffffff;
const M_AIR = bit(L.SKY, L.MOUNT, L.HILL, L.WATER);                          // what a beam of light shows up against
const M_SOLID = bit(L.BANK, L.TOWER, L.BRIDGE, L.TREE, L.TOWN, L.PEOPLE, L.BOAT);

// @ts-check
// =================================================================== CINEMATIC CORE: FRAMEBUFFER AND LAYERS
// After the scene's config: needs W, H, IY0, IY1 (the image rows between any letterbox bars), IH and T.
const fb = new Uint8Array(W * H);     // palette indices
const lid = new Uint8Array(W * H);    // layer ids (light masks)

function pset(x, y, c, id) {
  if (x < 0 || x >= W || y < IY0 || y >= IY1) return;
  const i = y * W + x; fb[i] = c; lid[i] = id;
}
function fillRect(x, y, w, h, c, id) {
  const x0 = Math.max(0, x), x1 = Math.min(W, x + w), y0 = Math.max(IY0, y), y1 = Math.min(IY1, y + h);
  for (let yy = y0; yy < y1; yy++) {
    let i = yy * W + x0;
    for (let xx = x0; xx < x1; xx++, i++) { fb[i] = c; lid[i] = id; }
  }
}
// remap a single pixel if its layer id is accepted by mask (bitmask of layer ids)
function premap(x, y, map, mask) {
  if (x < 0 || x >= W || y < IY0 || y >= IY1) return;
  const i = y * W + x;
  if (mask & (1 << lid[i])) fb[i] = map[fb[i]];
}

// ------------------------------------------------------------------ layer buffers
function makeLayer(w, h, f, defId) {
  return { w, h, f, buf: new Uint8Array(w * h).fill(T), ids: new Uint8Array(w * h).fill(defId), defId };
}
function lset(ly, x, y, c, id) {
  if (x < 0 || y < 0 || x >= ly.w || y >= ly.h) return;
  const i = y * ly.w + x; ly.buf[i] = c; ly.ids[i] = id === undefined ? ly.defId : id;
}
function lget(ly, x, y) { return (x < 0 || y < 0 || x >= ly.w || y >= ly.h) ? T : ly.buf[y * ly.w + x]; }
function lrect(ly, x, y, w, h, c, id) {
  for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) lset(ly, xx, yy, c, id);
}
// blit a layer at camera offset (layer y maps to image row y when offset is 0)
function blit(ly, ox, oy) {
  const buf = ly.buf, ids = ly.ids, lw = ly.w;
  for (let r = 0; r < IH; r++) {
    const sy = r + oy;
    if (sy < 0 || sy >= ly.h) continue;
    let si = sy * lw + ox, di = (r + IY0) * W;
    for (let x = 0; x < W; x++, si++, di++) {
      const sx = x + ox;
      if (sx < 0 || sx >= lw) continue;
      const c = buf[si];
      if (c !== T) { fb[di] = c; lid[di] = ids[si]; }
    }
  }
}

// @ts-check
// =================================================================== NIGHT BRIDGE: THE WORLD (built once)
// ------------------------------------------------------------------ bridge geometry (the layout tool's formulas)
const TOP_Y = pct(LAY.peakY);
const A_L = (TOP_Y - pct(LAY.leftY)) / Math.max(1, (LAY.peakX - LAY.leftX) ** 2);
const A_R = (TOP_Y - pct(LAY.rightY)) / Math.max(1, (LAY.rightX - LAY.peakX) ** 2);
const ARCH_L = LAY.leftX + LAY.approach, ARCH_R = LAY.rightX - LAY.approach;
/** world y of the walking surface at x: two half-parabolas meeting at the top, then the street */
function deck(x) {
  if (x >= LAY.rightX) return STREET_Y;
  if (x <= LAY.leftX) return pct(LAY.leftY);
  return TOP_Y - (x <= LAY.peakX ? A_L : A_R) * (x - LAY.peakX) ** 2;
}
/** how far the arch hangs below the deck: thin at the top, deep near the ends (hyperbola-shaped) */
function depthAt(x) {
  const span = x <= LAY.peakX ? LAY.peakX - ARCH_L : ARCH_R - LAY.peakX;
  const u = Math.min(1, Math.abs(x - LAY.peakX) / Math.max(1, span)), k = LAY.sharp;
  return LAY.thickTop + (LAY.thickEnd - LAY.thickTop) * (Math.sqrt(1 + (u * k) ** 2) - 1) / (Math.sqrt(1 + k * k) - 1);
}
const under = (x) => deck(x) - depthAt(x);
const LH_X = LAY.peakX + LAY.lhDx;                         // lighthouse centre
const LH_DOOR = Math.round(deck(LAY.peakX) + LAY.stairRise);   // world y of its doorstep
const LH_TOP = LH_DOOR + LAY.lhH;                          // the gallery
const STAIR_X0 = LAY.peakX - 6, STAIR_X1 = LH_X + 6;      // the far railing's gap for the stairs

// ------------------------------------------------------------------ layers in world coordinates
// A layer covers world x from x0 and world y from 0 (the bottom of the opening shot) up to its height.
/** @param {number} x0 @param {number} w @param {number} h @param {number} f @param {number} id */
function worldLayer(x0, w, h, f, id) { return Object.assign(makeLayer(w, h, f, id), { x0 }); }
function wset(ly, x, y, c, id) { lset(ly, Math.round(x) - ly.x0, ly.h - 1 - Math.round(y), c, id); }
function wget(ly, x, y) { return lget(ly, Math.round(x) - ly.x0, ly.h - 1 - Math.round(y)); }
// screen position of a world point on a layer moving at f, for the camera at (cx, cu)
const scrX = (x, f, cx) => Math.round(x) - Math.round(cx * f);
const scrY = (y, f, cu) => H - 1 - Math.round(y) + Math.round(cu * f);
function blitWorld(ly, cx, cu) { blit(ly, Math.round(cx * ly.f) - ly.x0, ly.h - H - Math.round(cu * ly.f)); }

const skyL = worldLayer(0, W, H, LAY.pSky, L.SKY);
const mountL = worldLayer(-10, W + 80, LH, LAY.pMount, L.MOUNT);
const hillL = worldLayer(-10, W + 160, LH, LAY.pHills, L.HILL);
const worldL = worldLayer(-40, LAY.worldW + 140, LH, 1, L.WATER);     // water, banks, lighthouse, town
const bridgeL = worldLayer(-40, LAY.worldW + 140, LH, 1, L.BRIDGE);   // the bridge's lines, pots and trees
const camelliaL = worldLayer(-40, LAY.worldW + 140, LH, LAY.pFore, L.TREE);
const glassMask = new Uint8Array(worldL.w * worldL.h);                // 1 bridge body, 2 far railing panel
function glassAt(x, y, v) {
  const lx = Math.round(x) - worldL.x0, ly = worldL.h - 1 - Math.round(y);
  if (lx >= 0 && ly >= 0 && lx < worldL.w && ly < worldL.h) glassMask[ly * worldL.w + lx] = v;
}

// ------------------------------------------------------------------ sky and moon (fixed on screen)
const SKY_BANDS = [C.SK6, C.SK5, C.SK4, C.SK3, C.SK2, C.SK1, C.SK0];
const MOON_X = LAY.moonX, MOON_Y = pct(LAY.moonY);
function buildSky() {
  for (let y = 0; y < H; y++) {
    const v = Math.min(SKY_BANDS.length - 1.001, (y / H) * 1.25 * SKY_BANDS.length - 1.2);
    for (let x = 0; x < W; x++) {
      const i = Math.max(0, Math.floor(v)), c = bay(x, y) < v - i ? Math.min(i + 1, SKY_BANDS.length - 1) : i;
      wset(skyL, x, y, SKY_BANDS[c], L.SKY);
    }
  }
  const R = LAY.moonR;
  for (let dy = -R - 9; dy <= R + 9; dy++) for (let dx = -R - 9; dx <= R + 9; dx++) {
    const d = Math.hypot(dx, dy), x = MOON_X + dx, y = MOON_Y + dy;
    if (d <= R) {
      const crater = hash(Math.round(dx / 3) + 40, Math.round(dy / 3) + 7) < 0.22 && d < R - 1.5;
      wset(skyL, x, y, d > R - 1 || crater ? C.MOONS : C.MOON, L.SKY);
    } else if (bay(x, y) < 0.55 * (1 - (d - R) / 9)) wset(skyL, x, y, C.HALO, L.SKY);
  }
}

// ------------------------------------------------------------------ mountain, hills, cliffs
const hillBase = (x) => pct(LAY.hills) + pct(LAY.slope) * (x / LAY.worldW - 0.5);
function mountainShape(u) {                     // 0..1 across a broad cone, flat-topped, a shoulder on the right
  const a = Math.abs(u);
  if (a >= 1) return 0;
  let s = u < 0 ? 1 - Math.pow(a, 1.55) : 1 - Math.pow(a, 1.3);
  s += 0.07 * Math.exp(-(((u - 0.42) / 0.11) ** 2));
  return Math.min(0.96, s);
}
function buildMountain() {
  const top = pct(LAY.mountH), half = LAY.mountW / 2;
  for (let x = mountL.x0; x < mountL.x0 + mountL.w; x++) {
    const u = (x - LAY.mountX) / half, s = mountainShape(u);
    if (s <= 0) continue;
    const base = hillBase(x) - 6, h = base + (top - base) * s;
    const snowLine = top - 14 - 5 * hash(Math.floor(x / 3), 3) - 3 * Math.sin(x / 5);
    for (let y = 0; y <= h; y++) {
      const lit = u > 0.05 + 0.04 * Math.sin(y / 3), snow = y > snowLine;
      let c = snow ? (lit ? C.SNOW1 : C.SNOW0) : (lit ? C.MT2 : C.MT1);
      if (!snow && y < base + 12 && bay(x, y) < (base + 12 - y) / 12) c = C.MT0;
      wset(mountL, x, y, c, L.MOUNT);
    }
  }
}
const hillTop = (x) => hillBase(x) + 6 * Math.sin(x / 37) + 4 * Math.sin(x / 13 + 1);
function buildHills() {
  for (let x = hillL.x0; x < hillL.x0 + hillL.w; x++) {
    const h = hillTop(x);
    for (let y = 0; y <= h; y++) {
      const d = h - y;           // depth below the crest
      const c = d < 1 ? C.HL3 : d < 3 + 2 * bay(x, y) ? C.HL2 : (Math.floor(x / 45) & 1) ? C.HL1 : C.HL0;
      wset(hillL, x, y, c, L.HILL);
    }
  }
  for (let k = 0; k < LAY.cliffs; k++) {            // violet-plum earth showing through
    const cx = ((k + 0.5) / LAY.cliffs) * LAY.worldW * 0.9 + 20, h = hillTop(cx) - 1;
    for (let r = 0; r < 12; r++) {
      const w = 12 - r * 0.7, x0 = cx - 7 + r * 0.5;
      for (let x = Math.round(x0); x < x0 + w; x++)

// ------------------------------------------------------------------ water, banks, lighthouse, town
const SHOP_W = [46, 66, 52, 50], SHOP_H = [64, 92, 70, 58];
/** @type {{x: number, w: number, h: number, inn: boolean}[]} */
const SHOPS = [];
{ let x = LAY.shopsX; for (let i = 0; i < LAY.shops; i++) { const w = SHOP_W[i % 4]; SHOPS.push({ x, w, h: SHOP_H[i % 4], inn: i + 1 === LAY.inn }); x += w + 6; } }
const INN = SHOPS.find(s => s.inn) || SHOPS[0];

const INN_LAMP_X = INN_DOOR_X - SIZE.innDoorW / 2 - 4, INN_LAMP_Y = STREET_Y + 30;

function buildWater() {
  for (let x = worldL.x0; x < worldL.x0 + worldL.w; x++) for (let y = 0; y < RIVER_Y; y++) {
    const v = y / RIVER_Y + 0.25 * bay(x, y);      // lighter towards the far water, where it catches the sky
    wset(worldL, x, y, v > 0.9 ? C.W2 : v > 0.45 ? C.W1 : C.W0, L.WATER);
  }
}
function buildBanks() {
  const wall = (x0, x1) => {
    for (let x = x0; x < x1; x++) for (let y = Math.floor(WATER_Y); y <= STREET_Y; y++) {
      const course = Math.floor((y - WATER_Y) / 4), joint = (x + course * 5) % 11 === 0 || (y - Math.floor(WATER_Y)) % 4 === 0;
      wset(worldL, x, y, y >= STREET_Y - 1 ? C.ST2 : joint ? C.ST0 : C.ST1, L.BANK);
    }
  };
  wall(LAY.rightX - 2, worldL.x0 + worldL.w);
  wall(worldL.x0, LAY.leftX + 2);
}
function buildLighthouse() {
  for (let x = LH_X - 15; x <= LH_X + 15; x++) {                // the rock it stands on
    const h = WATER_Y + 7 - Math.abs(x - LH_X) * 0.4 + 2 * hash(x, 9);
    for (let y = WATER_Y - 1; y <= h; y++) wset(worldL, x, y, hash(x >> 1, y >> 1) < 0.3 ? C.ST0 : C.ST1, L.TOWER);
  }
  for (let y = Math.floor(WATER_Y + 4); y <= LH_TOP; y++) {     // the tower, tapering
    const half = (SIZE.lhW / 2) * (1 - 0.22 * (y - WATER_Y) / (LH_TOP - WATER_Y)), band = Math.abs(y - (LH_DOOR + LAY.lhH * 0.55)) < 3;
    for (let x = Math.round(LH_X - half); x <= Math.round(LH_X + half); x++) {
      const u = (x - LH_X) / half;                                // the moon is to the right
      let c = band ? (u > 0.1 ? C.ST2 : C.ST1) : u > 0.15 ? C.ST3 : u > -0.45 ? C.ST2 : C.ST1;
      if (Math.abs(u) > 0.9) c = C.ST1;
      if (y < deck(x) + 4) c = u > 0.15 ? C.ST1 : C.ST0;           // below the deck: behind the bridge, in its shadow
      wset(worldL, x, y, c, L.TOWER);
    }
  }
  for (const wy of [LH_DOOR + 46, LH_DOOR + 70]) for (let y = wy; y < wy + 5; y++) wset(worldL, LH_X + 1, y, C.WL0, L.TOWER);
  for (let x = LH_X - 9; x <= LH_X + 9; x++) { wset(worldL, x, LH_TOP + 1, C.G2, L.TOWER); wset(worldL, x, LH_TOP + 3, C.G1, L.TOWER); }
  for (let y = LH_TOP + 4; y <= LH_TOP + 12; y++) for (let x = LH_X - 5; x <= LH_X + 5; x++)       // the lamp room
    wset(worldL, x, y, Math.abs(x - LH_X) === 5 || x === LH_X ? C.G0 : C.WL1, L.TOWER);
  for (let r = 0; r < 5; r++) for (let x = LH_X - 6 + r; x <= LH_X + 6 - r; x++) wset(worldL, x, LH_TOP + 13 + r, r === 0 ? C.ST1 : C.ST0, L.TOWER);
  wset(worldL, LH_X, LH_TOP + 18, C.G2, L.TOWER); wset(worldL, LH_X, LH_TOP + 19, C.G2, L.TOWER);
  // the door, its arch, the lock
  const dw = SIZE.doorW / 2;
  for (let y = LH_DOOR; y < LH_DOOR + SIZE.doorH; y++) for (let x = LH_X - dw; x < LH_X + dw; x++) {
    const arch = y - LH_DOOR > SIZE.doorH - 4 && Math.hypot(x + 0.5 - LH_X, (y - (LH_DOOR + SIZE.doorH - 4)) * 1.3) > dw;
    if (!arch) wset(worldL, x, y, (x - LH_X + dw) % 3 === 0 ? C.WD0 : C.WD1, L.TOWER);
  }
  wset(worldL, LH_X + dw - 2, LH_DOOR + 15, C.AM1, L.TOWER);
  // the stairs from the top of the deck, climbing away from us to the door
  const n = Math.max(2, Math.round(LAY.stairRise / 2));
  for (let s = 0; s <= n; s++) {
    const t = s / n, cx = LAY.peakX + (LH_X - LAY.peakX) * t, y = lerp(deck(LAY.peakX) + 4, LH_DOOR, t), w = 12 - t * 3;
    for (let x = Math.round(cx - w / 2); x <= Math.round(cx + w / 2); x++) { wset(worldL, x, y, C.G1, L.BRIDGE); wset(worldL, x, y - 1, C.ST1, L.BRIDGE); }
  }
}
function buildTown() {
  for (const s of SHOPS) {
    const y0 = STREET_Y + 1;

      wset(worldL, x, y, x >= s.x + s.w - 2 ? C.WL2 : x === s.x ? C.WL0 : C.WL1, L.TOWN);
    for (let x = s.x - 2; x < s.x + s.w + 2; x++) { wset(worldL, x, y0 + s.h, C.WL3, L.TOWN); wset(worldL, x, y0 + s.h + 1, C.WL2, L.TOWN); }
    for (let r = 0; r < 7; r++) for (let x = s.x + r; x < s.x + s.w - r; x++) wset(worldL, x, y0 + s.h + 2 + r, r ? C.BT0 : C.BT1, L.TOWN);
    // windows: a shop window below, smaller ones above (the inn's are lit dynamically)
    const rows = s.h > 80 ? [y0 + 36, y0 + 58] : [y0 + 36];
    for (const wy of rows) for (let wx = s.x + 6; wx + 8 <= s.x + s.w - 4; wx += 15) {
      if (s.inn && Math.abs(wx + 4 - INN_WIN_X) < 9 && wy === y0 + 58) continue;
      const lit = hash(wx, wy) < 0.3;
      for (let y = wy; y < wy + 10; y++) for (let x = wx; x < wx + 8; x++)

    }
    if (!s.inn) for (let y = y0; y < y0 + 26; y++) for (let x = s.x + 6; x < s.x + 18; x++) wset(worldL, x, y, x === s.x + 6 ? C.WD1 : hash(x, 3) < 0.2 ? C.WL0 : C.WL1, L.TOWN);
    else for (let y = y0; y < y0 + 26; y++) for (let x = s.x + s.w - 16; x < s.x + s.w - 5; x++) wset(worldL, x, y, y > y0 + 12 ? C.AM0 : C.AM1, L.WIN);

  const dw = SIZE.innDoorW / 2;
  for (let y = STREET_Y + 1; y <= STREET_Y + SIZE.innDoorH; y++) for (let x = INN_DOOR_X - dw - 1; x <= INN_DOOR_X + dw; x++)
    wset(worldL, x, y, x === INN_DOOR_X - dw - 1 || x === INN_DOOR_X + dw || y === STREET_Y + SIZE.innDoorH ? C.WL3 : x === INN_DOOR_X ? C.WD0 : C.WD1, L.TOWN);
  for (let y = INN_WIN_Y; y < INN_WIN_Y + 12; y++) for (let x = INN_WIN_X - 5; x <= INN_WIN_X + 5; x++)
    wset(worldL, x, y, x === INN_WIN_X - 5 || x === INN_WIN_X + 5 || y === INN_WIN_Y ? C.WL3 : C.WL0, L.WIN);
  for (let y = INN_LAMP_Y; y < INN_LAMP_Y + 5; y++) wset(worldL, INN_LAMP_X - 2, y + 3, C.ST1, L.TOWN);
  for (let x = INN_LAMP_X - 2; x <= INN_LAMP_X; x++) wset(worldL, x, INN_LAMP_Y + 8, C.ST1, L.TOWN);
  for (let y = STREET_Y + 38; y < STREET_Y + 45; y++) for (let x = INN_DOOR_X - 12; x <= INN_DOOR_X + 12; x++)
    wset(worldL, x, y, y === STREET_Y + 38 || y === STREET_Y + 44 ? C.WD0 : C.AM0, L.TOWN);
}
function buildCamellia() {
  const x0 = LAY.camelliaX, g = STREET_Y + 1;
  for (let y = g; y < g + 52; y++) { wset(camelliaL, x0, y, C.WD0, L.TREE); if (y < g + 30) wset(camelliaL, x0 + 1, y, C.WD1, L.TREE); }
  for (let k = 0; k < 8; k++) {                                   // a few round masses of leaves, with gaps for the moon
    const cx = x0 + (hash(k, 1) - 0.5) * 30, cy = g + 60 + hash(k, 2) * 42, r = 7 + hash(k, 3) * 7;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r * 1.3; dx <= r * 1.3; dx++) {
      const d = Math.hypot(dx / 1.3, dy) / r;
      if (d > 1 || hash(Math.round(cx + dx), Math.round(cy + dy) + 50) < 0.18 * d) continue;
      const lit = dx > r * 0.3 && dy > -2;
      const bloom = hash(Math.round(cx + dx) * 3, Math.round(cy + dy)) < 0.045;

// ------------------------------------------------------------------ the bridge
/** @type {{x: number, larch: boolean, h: number}[]} */
const TREES = [];
const LAMPS = [];        // x positions along the near railing
const GLOWS = [];        // [x, y] inside the girders
function buildBridge() {
  const x0 = Math.ceil(LAY.leftX), x1 = Math.floor(LAY.rightX);
  for (let x = x0; x <= x1; x++) {
    const d = deck(x), inArch = x >= ARCH_L && x <= ARCH_R, u = inArch ? under(x) : WATER_Y;
    for (let y = Math.ceil(u); y < d - 1; y++) glassAt(x, y, 1);
    if (x < STAIR_X0 || x > STAIR_X1) for (let y = Math.round(d + 3); y < d + 3 + SIZE.rail; y++) glassAt(x, y, 2);
    wset(bridgeL, x, d, C.G3, L.BRIDGE); wset(bridgeL, x, d - 1, C.G2, L.BRIDGE);
    if (inArch) { wset(bridgeL, x, u, C.G1, L.BRIDGE); wset(bridgeL, x, u - 1, C.G0, L.BRIDGE); }
    if (x < STAIR_X0 || x > STAIR_X1) {
      wset(bridgeL, x, d + 3 + SIZE.rail, C.G1, L.BRIDGE);                         // far railing
      if (x % 9 === 0) for (let y = d + 3; y < d + 3 + SIZE.rail; y++) wset(bridgeL, x, y, C.G0, L.BRIDGE);
    }
  }
  // end spans: piers to the water, arched openings (clear glass), and the pier lines
  for (const side of [0, 1]) {
    const a = side ? ARCH_R : LAY.leftX, b = side ? LAY.rightX : ARCH_L;
    for (let y = WATER_Y; y < deck(side ? a : b) - 1; y++) for (const px of [side ? a : b, (side ? a : b) + (side ? -1 : 1)]) wset(bridgeL, px, y, C.G1, L.BRIDGE);
    for (let o = 0; o < LAY.openings; o++) {
      const ow = (b - a) / (LAY.openings + 0.5), oc = a + (o + 0.75) * ow, r = ow * 0.32, top = deck(oc) - 7 - r;
      for (let x = Math.round(oc - r); x <= Math.round(oc + r); x++) {
        const yTop = top + Math.sqrt(Math.max(0, r * r - (x - oc) ** 2));
        for (let y = WATER_Y; y <= yTop; y++) glassAt(x, y, 0);
        wset(bridgeL, x, yTop, C.G1, L.BRIDGE);
      }
      for (let y = WATER_Y; y <= top; y++) { wset(bridgeL, oc - r, y, C.G0, L.BRIDGE); wset(bridgeL, oc + r, y, C.G0, L.BRIDGE); }
    }
  }
  // girders: alternating diagonals between the deck and the arch
  const gx = (i) => ARCH_L + (ARCH_R - ARCH_L) * i / LAY.panels;
  for (let i = 0; i < LAY.panels; i++) {
    const a = gx(i), b = gx(i + 1), up = i % 2 === 0;
    const [xa, ya, xb, yb] = up ? [a, deck(a) - 2, b, under(b) + 1] : [a, under(a) + 1, b, deck(b) - 2];
    const n = Math.ceil(Math.max(Math.abs(xb - xa), Math.abs(yb - ya)));
    for (let k = 0; k <= n; k++) wset(bridgeL, xa + (xb - xa) * k / n, ya + (yb - ya) * k / n, C.G1, L.BRIDGE);
    wset(bridgeL, a, deck(a) - 2, C.G2, L.BRIDGE);
  }
  for (let i = 0; i < LAY.glowN; i++) { const x = ARCH_L + (ARCH_R - ARCH_L) * (i + 0.5) / LAY.glowN; GLOWS.push([x, (deck(x) + under(x)) / 2]); }
  for (let x = LAY.leftX + 4; x < LAY.rightX; x += LAY.lampEvery) LAMPS.push(x);
  // trees in translucent pots along the far railing, none at the top where the stairs are
  for (let i = 0; i < LAY.trees; i++) {
    let x = LAY.leftX + 20 + (LAY.rightX - LAY.leftX - 40) * (i + 0.5) / LAY.trees;
    if (x > STAIR_X0 - 8 && x < STAIR_X1 + 8) x = x < LAY.peakX ? STAIR_X0 - 8 : STAIR_X1 + 8;
    const larch = (i + 1) % LAY.larchEvery === 0;
    TREES.push({ x: Math.round(x), larch, h: Math.round(SIZE.treeH * (larch ? 0.8 : 1) * (0.9 + 0.2 * hash(i, 5))) });
  }
  for (const t of TREES) {
    const y0 = deck(t.x) + 4;
    for (let x = t.x - 3; x <= t.x + 3; x++) { wset(bridgeL, x, y0, C.G1, L.TREE); wset(bridgeL, x, y0 + 3, C.G2, L.TREE); }
    for (let x = t.x - 2; x <= t.x + 2; x++) { wset(bridgeL, x, y0 + 1, C.G0, L.TREE); wset(bridgeL, x, y0 + 2, C.WD0, L.TREE); }
    wset(bridgeL, t.x - 1, y0 + 4, C.WD1, L.TREE); wset(bridgeL, t.x, y0 + 4, C.WD1, L.TREE); wset(bridgeL, t.x + 1, y0 + 4, C.WD0, L.TREE);
    for (let r = 0; r < t.h; r++) {
      const v = r / t.h, w = t.larch ? 2.6 * (1 - v) + 0.6 + (r % 3 === 0 ? 0.8 : 0) : 1.9 * (1 - v * v) + 0.4;
      for (let x = Math.round(t.x - w); x <= Math.round(t.x + w); x++) {
        const lit = x > t.x;
        wset(bridgeL, x, y0 + 5 + r, t.larch ? (lit && (r + x) % 3 ? C.LA1 : C.LA0) : (lit ? C.HL3 : x === t.x ? C.LF1 : C.LF0), L.TREE);
      }
    }
    for (let k = 0; k < 3; k++) {                                // roots creeping down the glass
      let x = t.x - 2 + k * 2;
      const len = 3 + Math.round(hash(t.x, k) * 6);
      for (let r = 0; r < len; r++) { if (hash(t.x + r, k + 9) < 0.35) x += k - 1; wset(bridgeL, x, deck(x) - 2 - r, C.WD0, L.TREE); }
    }
  }
}

// @ts-check
// =================================================================== NIGHT BRIDGE: PEOPLE (procedural sprites)
// Each figure is drawn every frame from a pose into a scratch sprite (feet at SAY, centre at SAX), then set into the
// framebuffer with moonlight on the edges that face the moon. Sizes are the brief's: her 30 px, the children 21 and
// 19. All five are original designs (docs/design-log/night-bridge.md).
const SPR = 52, SAX = 26, SAY = 47;
const spr = new Uint8Array(SPR * SPR);
const SIDE = 0, FRONT = 1, BACK = 2;

function sp(x, y, c) {
  const sx = Math.round(x) + SAX, sy = Math.round(y) + SAY;
  if (sx >= 0 && sy >= 0 && sx < SPR && sy < SPR) spr[sy * SPR + sx] = c;
}
function seg(x0, y0, x1, y1, c, w) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
  const flat = Math.abs(x1 - x0) > Math.abs(y1 - y0);
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    sp(x, y, c);
    if (w > 1) flat ? sp(x, y + 1, c) : sp(x + 1, y, c);
  }
}
// fill a polygon given as [x, y, x, y, ...] (pixel centres inside it)
function poly(pts, c, edgeL, edgeR) {
  let y0 = Infinity, y1 = -Infinity;
  for (let i = 1; i < pts.length; i += 2) { y0 = Math.min(y0, pts[i]); y1 = Math.max(y1, pts[i]); }
  for (let y = Math.ceil(y0 - 0.5); y <= Math.floor(y1 + 0.5); y++) {
    const xs = [], yc = y;
    for (let i = 0, n = pts.length / 2; i < n; i++) {
      const ax = pts[i * 2], ay = pts[i * 2 + 1], bx = pts[((i + 1) % n) * 2], by = pts[((i + 1) % n) * 2 + 1];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const a = Math.round(xs[k]), b = Math.round(xs[k + 1]) - 1;
      for (let x = a; x <= b; x++) sp(x, y, x === a && edgeL !== undefined ? edgeL : x === b && edgeR !== undefined ? edgeR : c);
    }
  }
}
// a head bitmap: rows of letters, cx = the column over the body's centre; the last row is the neck
function headBm(rows, cx, top, colours, flip) {
  for (let r = 0; r < rows.length; r++) for (let k = 0; k < rows[r].length; k++) {
    const ch = rows[r][k];
    if (ch !== '.') sp(flip ? cx - (k - Math.floor(rows[r].length / 2)) : cx + (k - Math.floor(rows[r].length / 2)), top + r, colours[ch]);
  }
}

  set(snd.put.gain, b ? 0.05 * Math.min(1, b.s * 1.4) : 0);
  if (b) set(snd.putPan.pan, clamp((b.x - cx - W / 2) / W, -1, 1));
  set(snd.rum.gain, s2 ? 0.12 * s2.s : 0);
  if (s2) set(snd.rumPan.pan, clamp((s2.x - cx - W / 2) / W, -1, 1));
  if (t > sndLastT && t - sndLastT < 0.5) for (const [ct, name] of CUES) if (ct > sndLastT && ct <= t) soundCue(name);
  sndLastT = t;
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('pointerdown', () => soundStart());
  window.addEventListener('keydown', (e) => { if (actx && (e.key === 'm' || e.key === 'M')) sndMuted = !sndMuted; soundStart(); });
}

// @ts-check
// =================================================================== NIGHT BRIDGE: BUILD, TIME AND RENDER
let simFrame = 0;

// built once by init() in src_cine/99_main.js
function sceneBuild() {
  buildSky(); buildMountain(); buildHills(); buildWater(); buildBanks(); buildLighthouse(); buildTown(); buildCamellia(); buildBridge();
  buildStars(); buildVignette();
}
function loopReset() { /* nothing is simulated: every frame is a function of the time */ }
function update(f) { soundTick(f / FPS, cameraAt(f / FPS).x); }
// after the story the scene loops: from the end of the timeline back to STORY_F, not to the start
function step() {
  simFrame++;
  if (simFrame >= CINE_F) simFrame = STORY_F;
  update(simFrame);
}
// a frame index for things re-rolled by hash (sparkles), wrapped like the clock, so the loop point matches
const loopFrame = (f) => f < STORY_F ? f : STORY_F + (f - STORY_F) % LOOP_F;

const drawn = [];
function render(f) {
  const t = f / FPS, fl = loopFrame(f), cam = cameraAt(t), cx = cam.x, cu = cam.up, rcx = Math.round(cx);
  // far to near: sky and stars, mountain, hills, the world, the beam
  blitWorld(skyL, cx, cu); drawStars(t);
  blitWorld(mountL, cx, cu); blitWorld(hillL, cx, cu);
  blitWorld(worldL, cx, cu);
  drawLighthouseLamp(t, cx, cu);
  // boats upstream of the bridge are seen through it
  const st = storyT(t), fisher = boatAt(FISHER, st), steamer = boatAt(STEAMER, st);
  if (fisher && fisher.s < 0.5) drawFisher(fisher.x, fisher.s, t, cx, cu, 0);
  if (steamer && steamer.s < 0.5) drawSteamer(steamer.x, steamer.s, t, cx, cu);
  // the glass: everything behind the bridge's body shows through it, tinted and brighter
  const ox = rcx - worldL.x0, oy = worldL.h - H - Math.round(cu);
  for (let r = 0; r < H; r++) {
    const ly = r + oy; if (ly < 0 || ly >= worldL.h) continue;
    for (let x = 0; x < W; x++) {
      const lx = x + ox; if (lx < 0 || lx >= worldL.w) continue;
      const m = glassMask[ly * worldL.w + lx];
      if (m) fb[r * W + x] = (m === 1 ? GLASS : GLASS2)[fb[r * W + x]];
    }
  }
  blitWorld(bridgeL, cx, cu);
  drawSpots(t, cx, cu); drawGlows(t, cx, cu);
  blitWorld(camelliaL, cx, cu);
  drawInn(t, cx, cu); drawTowerDoor(t, cx, cu);
  // people, far ones first
  drawn.length = 0;
  for (const who of ORDER) { const p = evalPerson(who, t); if (p.on) drawn.push(p); }
  drawn.sort((a, b) => b.z - a.z || a.x - b.x);
  const moonSx = scrX(MOON_X, LAY.pSky, cx);
  for (const p of drawn) { drawFigure(p); placeFigure(p, scrX(p.x, 1, cx), scrY(p.y, 1, cu), moonSx); }
  drawNearRailing(cx, cu);
  drawReflections(t, fl, cu);
  // boats on our side of the bridge, the one moored near the town, then the small lights
  drawFisher(LAY.rightX - 40 + 3 * osc(1, t, 0), 1.5, t, cx, cu, osc(4, t, 0.2) > 0.5 ? 1 : 0);
  if (fisher && fisher.s >= 0.5) drawFisher(fisher.x, fisher.s, t, cx, cu, 0);
  if (steamer && steamer.s >= 0.5) drawSteamer(steamer.x, steamer.s, t, cx, cu);
  drawFireflies(t, cx, cu);
  for (let i = 0; i < W * H; i++) if (vig[i]) fb[i] = SHD[fb[i]];
}

// @ts-check
// =================================================================== CINEMATIC CORE: DISPLAY AND MAIN LOOP
// Loads last. The scene provides sceneBuild(), loopReset(), update(f), step(), render(f), simFrame and CINE_S.
// step() advances simFrame by one and wraps it where the scene's loop starts again.
const screenCv = /** @type {HTMLCanvasElement} */ (document.getElementById('screen'));
const sctx = screenCv.getContext('2d', { alpha: false });
const offCv = document.createElement('canvas');
offCv.width = W; offCv.height = H;
const octx = offCv.getContext('2d');
const img = octx.createImageData(W, H);
const out32 = new Uint32Array(img.data.buffer);
const PAL32 = new Uint32Array(256);
for (let i = 0; i < NPAL; i++) {
  const v = parseInt(PAL_HEX[i], 16);
  PAL32[i] = (0xff << 24 | (v & 0xff) << 16 | (v >> 8 & 0xff) << 8 | (v >> 16 & 0xff)) >>> 0;
}
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const bw = Math.floor(window.innerWidth * dpr), bh = Math.floor(window.innerHeight * dpr);
  screenCv.width = bw; screenCv.height = bh;
  scale = Math.max(1, Math.floor(Math.min(bw / W, bh / H)));
  offX = Math.floor((bw - W * scale) / 2); offY = Math.floor((bh - H * scale) / 2);
  sctx.imageSmoothingEnabled = false;
  sctx.fillStyle = '#000'; sctx.fillRect(0, 0, bw, bh);
}
function present() {
  for (let i = 0; i < W * H; i++) out32[i] = PAL32[fb[i]];
  octx.putImageData(img, 0, 0);
  sctx.imageSmoothingEnabled = false;
  sctx.drawImage(offCv, 0, 0, W, H, offX, offY, W * scale, H * scale);
}

const params = new URLSearchParams(location.search);
const FREEZE = params.get('freeze') === '1';
// mutable doubles live in a typed array so per-frame stores never box a heap number
const clk = new Float64Array(5);            // 0 accumulator, 1 last timestamp, 2 stat sum, 3 stat max, 4 stat count
clk[1] = -1;
// perf probe for verification (?stats=1 writes the mean frame cost into the title)
const STATS = params.get('stats') === '1';
function frameLoop(now) {
  if (clk[1] < 0) clk[1] = now;
  let dt = (now - clk[1]) / 1000; clk[1] = now;
  if (dt > 0.25) dt = 0.25;
  const c0 = STATS ? performance.now() : 0;
  if (!FREEZE) { clk[0] += dt; while (clk[0] >= DT) { step(); clk[0] -= DT; } }
  render(simFrame); present();
  if (STATS) {
    const c = performance.now() - c0; clk[4]++; clk[2] += c; if (c > clk[3] && clk[4] > 60) clk[3] = c;
    if ((clk[4] % 120) === 0) document.title = 'avg ' + (clk[2] / clk[4]).toFixed(2) + 'ms max ' + clk[3].toFixed(2) + 'ms f' + simFrame;
  }
  requestAnimationFrame(frameLoop);
}
function init() {
  sceneBuild();
  loopReset();
  const seek = parseFloat(params.get('t') || '0');
  const target = Math.floor(clamp(isNaN(seek) ? 0 : seek, 0, CINE_S - DT) * FPS);
  simFrame = 0; update(0);
  while (simFrame < target) step();
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frameLoop);
}
init();

</script>
